<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#142d4e"><title>Якбаяк CHAT</title>
<style>
:root{--navy:#142d4e;--blue:#2475d0;--bg:#edf2f7;--muted:#718096}*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:var(--bg);color:#172334}.top{background:var(--navy);color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:750}.sub{display:none}.badge{display:none}.config{background:#fff;padding:9px;display:flex;gap:6px;border-bottom:1px solid #dce3eb}body.connected .config{display:none}.config input{min-width:0;flex:1;padding:9px;border:1px solid #ccd6e2;border-radius:8px}.config button,.composer button,.toolbtn{border:0;background:var(--blue);color:white;border-radius:9px;padding:9px 13px;font-weight:650}.layout{display:flex;height:calc(100dvh - 54px);min-height:0;overflow:hidden}.side{width:34%;min-width:110px;background:white;border-right:1px solid #dce3eb;overflow:auto}.person{padding:14px 9px;border-bottom:1px solid #edf0f4;cursor:pointer}.person.active{background:#e8f1fc}.person b{display:block;font-size:13px}.person small{color:var(--muted);font-size:10px}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.chathead{background:white;padding:13px;border-bottom:1px solid #dce3eb;font-weight:700}.typing{font-size:11px;color:#2475d0;font-weight:400;min-height:15px}.messages{padding:12px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:9px}.bubble{max-width:90%;padding:10px 12px;border-radius:14px;background:white;box-shadow:0 1px 2px #0001;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#dcecff}.meta{font-size:10px;color:var(--muted);margin-top:4px}.bubble img{display:block;max-width: min(260px,70vw);max-height:240px;border-radius:9px;margin-top:7px}.attachment{display:inline-block;margin-top:7px;color:#145ba8;overflow-wrap:anywhere}.composer{background:white;padding:9px;padding-bottom:calc(9px + env(safe-area-inset-bottom));display:flex;position:sticky;bottom:0;gap:6px;border-top:1px solid #dce3eb;align-items:center}.composer input[type=text]{flex:1;min-width:0;border:1px solid #d3dce7;border-radius:22px;padding:11px;font-size:15px}.iconbtn{background:#edf2f7;color:#17385d;border:1px solid #d5deea;border-radius:10px;padding:9px;min-width:38px}.iconbtn.recording{background:#ffe0e0;color:#a00000}.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;padding:20px}.help{display:none}.smallnote{display:none}@media(max-width:520px){.side{width:31%;min-width:94px}.person{padding:12px 6px}.person b{font-size:12px}.chathead{font-size:14px}.messages{padding:8px}.composer{gap:4px;padding:6px}.iconbtn{padding:8px;min-width:34px}}
</style></head><body>
<header class="top"><div><div class="brand">Якбаяк CHAT</div><div class="sub">Локальная сеть · общий и личные чаты</div></div><span class="badge" id="status">Нет связи</span></header>
<div class="config"><input id="server" placeholder="Адрес сервера, например http://192.168.1.5:8765"><button id="connect">Подключить</button></div><div class="help" id="help">Запустите сервер на ноутбуке, введите IP-адрес и нажмите «Подключить». Все устройства должны быть в одной Wi-Fi сети.</div>
<div class="layout"><aside class="side" id="people"></aside><main class="chat"><div class="chathead"><div id="chatTitle">Общий чат</div><div class="typing" id="typing"></div></div><div class="messages" id="messages"><div class="empty">Подключите сервер, чтобы начать.</div></div><div class="smallnote" id="voiceNote">Файлы до 10 МБ. Запись голоса зависит от поддержки микрофона браузером.</div><form class="composer" id="form"><button class="iconbtn" type="button" id="attach" title="Фото или файл">📎</button><input id="file" type="file" hidden accept="image/*,audio/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"><button class="iconbtn" type="button" id="record" title="Записать голосовое">🎙</button><input id="input" type="text" autocomplete="off" placeholder="Написать сообщение…"><button type="submit">➤</button></form></main></div>
<script>
const $=id=>document.getElementById(id);let base=localStorage.getItem('yb_server')||location.origin;if(base==='null'||base==='file://')base='';$('server').value=base;
let myName=localStorage.getItem('yb_name')||prompt('Имя этого устройства (например, Планшет 1)')||'Гость';localStorage.setItem('yb_name',myName);let myId=localStorage.getItem('yb_id')||'';let room='all',seq=0,messages=[],users=[],typingUsers=[],busy=false,notified=false,lastInput=0,typingTimer=null,recorder=null,recordChunks=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function roomId(uid){return 'dm:'+[myId,uid].sort().join(':')}
function drawPeople(){let list=[{id:'all',name:'Общий чат',desc:'Все участники'}].concat(users.filter(u=>u.id!==myId).map(u=>({id:roomId(u.id),name:u.name,desc:'Личное сообщение'})));$('people').innerHTML=list.map(r=>`<div class="person ${r.id===room?'active':''}" data-id="${esc(r.id)}"><b>${esc(r.name)}</b><small>${esc(r.desc)}</small></div>`).join('');document.querySelectorAll('.person').forEach(el=>el.onclick=()=>{room=el.dataset.id;render()})}
function render(){drawPeople();let peer=users.find(u=>room===roomId(u.id));$('chatTitle').textContent=room==='all'?'Общий чат':(peer?peer.name:'Личная переписка');let list=messages.filter(m=>m.room===room);$('messages').innerHTML=list.length?list.map(m=>{let att='';if(m.attachment){let a=m.attachment;let url=base+a.url;if((a.type||'').startsWith('image/'))att=`<a href="${esc(url)}" target="_blank"><img src="${esc(url)}" alt="${esc(a.name)}"></a>`;else att=`<a class="attachment" href="${esc(url)}" target="_blank" download="${esc(a.name)}">📎 ${esc(a.name)} (${Math.ceil((a.size||0)/1024)} КБ)</a>`}return `<div class="bubble ${m.user_id===myId?'mine':''}">${esc(m.text||'')}${att}<div class="meta">${esc(m.name)} · ${new Date(m.ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`}).join(''):'<div class="empty">Пока нет сообщений.</div>';$('messages').scrollTop=$('messages').scrollHeight;let t=typingUsers.filter(x=>x.id!==myId&&x.room===room);$('typing').textContent=t.length?t.map(x=>x.name).join(', ')+' печатает…':''}
async function api(path,body){let r=await fetch(base+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка сервера');return j}
async function connect(){base=$('server').value.trim().replace(/\/$/,'');if(!base){alert('Введите адрес сервера ноутбука');return}localStorage.setItem('yb_server',base);try{{let h=await api('/api/hello',{action:'hello',id:myId||undefined,name:myName});myId=h.id;localStorage.setItem('yb_id',myId)}await api('/api/state?since=0&user_id='+encodeURIComponent(myId));document.body.classList.add('connected');$('status').textContent='Подключено';$('status').style.background='#245b45';$('help').textContent='Вы подключены. Выберите участника слева для личного чата. Нажмите на 📎 для файла.';if('Notification'in window&&Notification.permission==='default'){Notification.requestPermission().catch(()=>{})}if(!window.__ybPollStarted){window.__ybPollStarted=true;poll()}}catch(e){$('status').textContent='Ошибка связи';$('help').textContent='Не удалось подключиться: '+e.message+' Проверьте IP, порт и Wi-Fi.'}}
function notify(m){if(m.user_id===myId)return;let title=m.name+' — Якбаяк CHAT',body=m.text||(m.attachment?'Отправил файл: '+m.attachment.name:'Новое сообщение');if('Notification'in window&&Notification.permission==='granted'&&document.hidden){try{new Notification(title,{body})}catch(e){}}else if(document.hidden){document.title='● Новое сообщение — Якбаяк CHAT'} }
async function poll(){if(busy)return;busy=true;try{let s=await api('/api/state?since='+seq+'&user_id='+encodeURIComponent(myId));if(s.messages.length){for(let m of s.messages){messages.push(m);notify(m)}seq=Math.max(seq,...s.messages.map(m=>m.seq));}users=s.users;typingUsers=s.typing||[];await api('/api/ping',{action:'ping',user_id:myId}).catch(()=>{});$('status').textContent='В сети';$('status').style.background='#245b45';render()}catch(e){$('status').textContent='Нет связи';$('status').style.background='#8a5a12'}finally{busy=false;setTimeout(poll,1200)}}
async function send(text,attachment){if(!myId){throw Error('Сначала подключитесь к серверу')}const payload={action:'send',user_id:myId,room,text,attachment:attachment||null};try{await api('/api/send',payload)}catch(e){if(String(e.message).includes('зарегистрируйте устройство')){let h=await api('/api/hello',{action:'hello',id:myId,name:myName});myId=h.id;localStorage.setItem('yb_id',myId);payload.user_id=myId;await api('/api/send',payload)}else{throw e}}}
$('connect').onclick=connect;$('form').onsubmit=async e=>{e.preventDefault();let text=$('input').value.trim();if(!text)return;try{await send(text,null);$('input').value='';api('/api/typing',{action:'typing',user_id:myId,room,active:false}).catch(()=>{})}catch(err){alert('Сообщение не отправлено: '+err.message)}};
$('input').addEventListener('input',()=>{if(!myId)return;api('/api/typing',{action:'typing',user_id:myId,room,active:true}).catch(()=>{});clearTimeout(typingTimer);typingTimer=setTimeout(()=>api('/api/typing',{action:'typing',user_id:myId,room,active:false}).catch(()=>{}),2200)});
$('attach').onclick=()=>$('file').click();$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;if(f.size>10*1024*1024){alert('Максимальный размер файла — 10 МБ');$('file').value='';return}let reader=new FileReader();reader.onload=async()=>{try{let data=String(reader.result).split(',')[1];await send('',{name:f.name,type:f.type||'application/octet-stream',data});}catch(e){alert('Файл не отправлен: '+e.message)}$('file').value=''};reader.readAsDataURL(f)};
$('record').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();$('record').classList.remove('recording');$('record').textContent='🎙';return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){alert('Запись микрофона не поддерживается этим браузером по HTTP. Можно записать аудио отдельно и отправить через 📎. Для записи внутри приложения подключим Android APK с разрешением микрофона.');return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});if(blob.size>10*1024*1024){alert('Голосовое больше 10 МБ');return}let reader=new FileReader();reader.onload=async()=>{try{await send('',{name:'Голосовое сообщение.webm',type:blob.type,data:String(reader.result).split(',')[1]})}catch(e){alert('Голосовое не отправлено: '+e.message)}};reader.readAsDataURL(blob)};recorder.start();$('record').classList.add('recording');$('record').textContent='■'}catch(e){alert('Нет доступа к микрофону. Проверьте разрешение браузера или используйте APK.') }};
window.addEventListener('focus',()=>{document.title='Якбаяк CHAT'});if(base&&base.startsWith('http')){$('server').value=base;setTimeout(()=>{if(!myId||!window.__ybPollStarted)connect()},350)}
</script></body></html>
